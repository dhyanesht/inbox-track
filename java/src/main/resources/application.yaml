spring:
  application:
    name: inbox-track


  datasource:
    url: ${DB_JDBC_URL:jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:postgres}?sslmode=require&tcpKeepAlive=true}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000        # 10 min
      max-lifetime: 1500000       # 25 min (must be < Supabase 30m timeout)
      connection-timeout: 30000   # 30 sec
      validation-timeout: 5000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        format_sql: false

  flyway:
    enabled: false
    baseline-on-migrate: true  # Handles existing Supabase tables gracefully
    schema: job_track
    locations: classpath:db/migration

#logging:
#  level:
#    org.flywaydb: DEBUG
#    org.springframework.jdbc: DEBUG
#    org.hibernate.SQL: DEBUG              # Print SQL statements
#    org.hibernate.type.descriptor.sql: TRACE  # Print SQL bind parameters
#    root: DEBUG

resilience4j:
  circuitbreaker:
    configs:     # Global defaults for ALL circuit breakers
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      classifyEmail:  # Name your circuit breaker
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      gmailApi:
        max-attempts: 5
        wait-duration: 2s
        retry-exceptions:
          - com.google.api.client.googleapis.json.GoogleJsonResponseException

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers

groq:
  api-key: ${GROQ_API_KEY:fallback-key}
  model-name: openai/gpt-oss-120b

gmail:
  credentials-path: ${GMAIL_CREDENTIALS_PATH:/tokens/credentials.json}
  tokens-directory: ${GMAIL_TOKEN_DIRECTORY:/tokens}
  application-name: Inbox Track Spring Boot